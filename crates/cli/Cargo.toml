[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "marisjs"
path = "src/main.rs"

[dependencies]
parser = { path = "../parser" }
validator = { path = "../validator" }
codegen = { path = "../codegen" }
clap = { version = "4", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
